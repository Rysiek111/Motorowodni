<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Administratora - Egzaminy</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">

    <style>
        [hidden] { display: none !important; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #382313 0%, #1F1A17 45%, #000000 100%);
            color: #F5F1ED;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #E67817;
            text-shadow: 0 0 10px rgba(230, 120, 23, 0.2);
            margin-top: 0;
        }

        .section {
            background: rgba(31, 26, 23, 0.96);
            padding: 15px;
            border: 1px solid rgba(230, 120, 23, 0.2);
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        button {
            padding: 8px 12px;
            border: 1px solid rgba(230, 120, 23, 0.3);
            border-radius: 8px;
            background: #2A211B;
            color: #E67817;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #E67817;
            color: #1F1A17;
            border-color: #E67817;
            box-shadow: 0 0 10px rgba(230, 120, 23, 0.25);
        }

        .delete {
            background: #8F351B;
            color: #FFFFFF;
            border-color: #8F351B;
            margin-left: 6px;
        }

        .delete:hover {
            background: #B94720;
            color: #FFFFFF;
            border-color: #B94720;
            box-shadow: 0 0 10px rgba(185, 71, 32, 0.3);
        }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab { padding: 10px 18px; font-weight: bold; font-size: 15px; }
        .tab.active { background: #E67817; color: #1F1A17; border-color: #E67817; }

        .card {
            padding: 10px;
            border-bottom: 1px solid #403127;
        }

        .score-badge {
            color: #FFFFFF;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 5px;
            display: inline-block;
        }

        .hard {
            background: #2A211B;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #403127;
        }

        .profile-question {
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #403127;
        }

        .profile-question p { margin: 0 0 4px 0; }

        .blad {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid #f87171;
            color: #fecaca;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .muted { color: #B8A99C; font-size: 0.9em; }

        details summary {
            list-style: none;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            color: #E67817;
            padding: 5px;
            transition: color 0.2s ease;
        }

        details summary:hover { color: #FFAB52; }
        details summary::-webkit-details-marker { display: none; }
        details[open] summary::after { content: " ▲"; }
        details:not([open]) summary::after { content: " ▼"; }

        #search {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }

        #logoutBtn { position: fixed; top: 10px; right: 10px; z-index: 900; }
    </style>
</head>

<body>
    <!-- Logowanie administratora -->
    <div id="loginBox" style="position:fixed;inset:0;background:#0b0b0b;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;color:#fff;background:#1a1a1a;padding:30px 36px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);min-width:280px;">
            <h3 style="margin-top:0;">🔒 Logowanie administratora</h3>
            <input id="loginEmail" type="email" placeholder="E-mail" autocomplete="username"
                style="width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;border-radius:8px;border:none;">
            <input id="loginHaslo" type="password" placeholder="Hasło" autocomplete="current-password"
                style="width:100%;padding:10px;margin-bottom:12px;box-sizing:border-box;border-radius:8px;border:none;">
            <button id="loginBtn" style="width:100%;padding:10px;font-weight:bold;">Zaloguj</button>
            <p id="loginBlad" style="color:#f87171;margin:10px 0 0 0;min-height:1em;"></p>
        </div>
    </div>
    <button id="logoutBtn" hidden>Wyloguj</button>

    <div id="app" hidden>
        <h1 id="tytul"></h1>

        <div class="tabs">
            <button class="tab active" data-egzamin="motorowodni">⚓ Motorowodni</button>
            <button class="tab" data-egzamin="holownik">🚤 Holownik</button>
        </div>

        <div id="blad" class="blad" hidden></div>

        <div class="section">
            <h2>🟦 Dashboard</h2>
            <p>Ilość wykonanych testów: <span id="count">0</span></p>
            <p>Testy dziś: <span id="today">0</span></p>
            <p class="muted" id="prog"></p>
        </div>

        <div class="section">
            <details>
                <summary>📉 TOP 5 najtrudniejszych pytań</summary>
                <div id="hardestQuestions" style="margin-top:15px;">Ładowanie...</div>
            </details>
        </div>

        <div class="section">
            <h2>🟨 Lista Egzaminowanych</h2>
            <input id="search" placeholder="Szukaj kandydata...">
            <div id="users"></div>
        </div>

        <div class="section" id="profileSection">
            <h2>🟩 Profil kandydata</h2>
            <div id="profile">Kliknij kandydata, aby załadować szczegółowy arkusz odpowiedzi</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, getDocs, collection, deleteDoc, doc, getDoc }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_c5yD2XF-mbCK1NGLYMdIk7UVKGsLxoU",
            authDomain: "motorowodni-49c56.firebaseapp.com",
            projectId: "motorowodni-49c56",
            storageBucket: "motorowodni-49c56.firebasestorage.app",
            messagingSenderId: "634414019790",
            appId: "1:634414019790:web:f7ad6c6fc8bc424337cc9f",
            measurementId: "G-9E6DFZ072J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ===========================================================
        // Ustawienia egzaminów (tu zmieniasz kolekcje i progi zaliczenia)
        // prog: trzeba mieć "wymagane" poprawnych odpowiedzi z "z" pytań.
        // Gdy zestaw ma mniej pytań, liczy się ten sam stosunek procentowy.
        // ===========================================================
        const EGZAMINY = {
            motorowodni: {
                nazwa: "Patent Sternika Motorowodnego",
                wyniki: "motorowodni",
                pytania: "baza_pytan",
                prog: { wymagane: 65, z: 75 }
            },
            holownik: {
                nazwa: "Licencja na holowanie narciarza lub innych obiektów pływających",
                wyniki: "holownik",
                pytania: "baza_pytan_holownik",
                prog: { wymagane: 20, z: 25 }
            }
        };

        let aktywny = "motorowodni";
        let allData = [];
        const cacheZestawow = {};

        const $ = id => document.getElementById(id);

        // ===========================================================
        // Zabezpieczenie przed wstrzyknięciem kodu HTML z danych w bazie
        // ===========================================================
        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        // Dopuszczamy tylko adresy obrazków http(s), data:image i ścieżki względne
        function srcObrazka(url) {
            const s = String(url || "").trim();
            if (!s) return "";
            if (/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^(https?:|data:image\/)/i.test(s)) return "";
            return s;
        }

        function dataZ(u) {
            const d = u.data;
            if (!d) return null;
            if (typeof d.toDate === "function") return d.toDate();
            if (d.seconds) return new Date(d.seconds * 1000);
            return null;
        }

        // true = zdany, false = niezdany, null = brak danych do oceny
        function czyZdany(u, cfg) {
            const total = Array.isArray(u.wybory) ? u.wybory.length : 0;
            if (!total || typeof u.poprawne !== "number") return null;
            return u.poprawne * cfg.prog.z >= cfg.prog.wymagane * total;
        }

        function pokazBlad(tekst) {
            const el = $("blad");
            el.hidden = !tekst;
            el.textContent = tekst || "";
        }

        // ===========================================================
        // Logowanie
        // ===========================================================
        async function zaloguj() {
            $("loginBlad").textContent = "";
            try {
                await signInWithEmailAndPassword(auth, $("loginEmail").value.trim(), $("loginHaslo").value);
                $("loginHaslo").value = "";
            } catch (e) {
                console.error(e);
                $("loginBlad").textContent = "Błędny e-mail lub hasło";
            }
        }
        $("loginBtn").addEventListener("click", zaloguj);
        $("loginHaslo").addEventListener("keydown", e => { if (e.key === "Enter") zaloguj(); });
        $("logoutBtn").addEventListener("click", () => signOut(auth));

        onAuthStateChanged(auth, user => {
            $("loginBox").style.display = user ? "none" : "flex";
            $("logoutBtn").hidden = !user;
            $("app").hidden = !user;
            if (user) {
                load();
            } else {
                // po wylogowaniu usuwamy dane z pamięci strony
                allData = [];
                $("users").innerHTML = "";
                $("profile").textContent = "";
            }
        });

        // ===========================================================
        // Wczytywanie danych
        // ===========================================================
        async function load() {
            const biezacy = aktywny;
            const cfg = EGZAMINY[biezacy];

            $("tytul").textContent = "📊 Analiza wyników – " + cfg.nazwa;
            $("prog").textContent = `Próg zaliczenia: ${cfg.prog.wymagane} z ${cfg.prog.z} poprawnych odpowiedzi (${(cfg.prog.wymagane / cfg.prog.z * 100).toFixed(1)}%)`;
            $("users").textContent = "Ładowanie...";
            $("hardestQuestions").textContent = "Ładowanie...";
            $("profile").textContent = "Kliknij kandydata, aby załadować szczegółowy arkusz odpowiedzi";
            pokazBlad("");

            let dane = [];
            try {
                const snap = await getDocs(collection(db, cfg.wyniki));
                dane = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
                console.error(e);
                if (biezacy !== aktywny) return;
                allData = [];
                pokazBlad(e && e.code === "permission-denied"
                    ? "Brak uprawnień do odczytu wyników. Zaloguj się kontem administratora, którego UID jest wpisany w regułach Firestore."
                    : "Nie udało się pobrać wyników z bazy: " + (e && e.message ? e.message : e));
                renderDashboard();
                renderUsers();
                return;
            }

            if (biezacy !== aktywny) return;   // zmieniono zakładkę w trakcie ładowania
            allData = dane;
            renderDashboard();
            renderUsers();
        }

        // ===========================================================
        // Dashboard i ranking trudnych pytań
        // ===========================================================
        function renderDashboard() {
            $("count").textContent = allData.length;

            const dzis = new Date().toDateString();
            $("today").textContent = allData.filter(u => {
                const d = dataZ(u);
                return d && d.toDateString() === dzis;
            }).length;

            const stat = {};
            allData.forEach(u => {
                if (!Array.isArray(u.wybory)) return;
                u.wybory.forEach((w, j) => {
                    if (typeof w.wynik !== "boolean") return;
                    const nr = w.NumerPytania ?? (j + 1);
                    const klucz = u.zestaw + "|" + nr;
                    if (!stat[klucz]) {
                        stat[klucz] = { zestaw: u.zestaw, numer: nr, tresc: w.pytanie, wszystkie: 0, bledne: 0 };
                    }
                    stat[klucz].wszystkie++;
                    if (!w.wynik) stat[klucz].bledne++;
                });
            });

            const ranking = Object.values(stat)
                .filter(p => p.bledne > 0)
                .sort((a, b) => (b.bledne / b.wszystkie) - (a.bledne / a.wszystkie) || b.wszystkie - a.wszystkie)
                .slice(0, 5);

            let html = "";
            ranking.forEach((p, i) => {
                const medal = ["🥇", "🥈", "🥉"][i] || `${i + 1}.`;
                const procent = Math.round((p.bledne / p.wszystkie) * 100);
                html += `
                    <div class="hard">
                        <b>${medal} ${esc(p.zestaw)} - Pytanie ${esc(p.numer)}</b><br><br>
                        ${esc(p.tresc)}<br><br>
                        ❌ <b>${p.bledne}</b> błędnych odpowiedzi z <b>${p.wszystkie}</b> (${procent}%)
                    </div>`;
            });
            $("hardestQuestions").innerHTML = html || "Brak danych.";
        }

        // ===========================================================
        // Lista kandydatów
        // ===========================================================
        function renderUsers() {
            const cfg = EGZAMINY[aktywny];
            const q = ($("search").value || "").toLowerCase();

            const lista = allData
                .filter(u => u.gracz && String(u.gracz).toLowerCase().includes(q))
                .sort((a, b) => (dataZ(b)?.getTime() || 0) - (dataZ(a)?.getTime() || 0));

            let html = "";
            lista.forEach(u => {
                const d = dataZ(u);
                const data = d ? d.toLocaleString("pl-PL") : "";
                const total = Array.isArray(u.wybory) ? u.wybory.length : null;
                const zdany = czyZdany(u, cfg);
                const kolor = zdany === null ? "#64748b" : (zdany ? "#10b981" : "#ef4444");
                const procent = u.procent !== undefined ? Number(u.procent).toFixed(2) + "%" : "-";
                const popr = u.poprawne !== undefined ? u.poprawne : "-";

                html += `
                    <div class="card">
                        <b>${esc(u.gracz)}</b> <span class="muted">(${esc(u.zestaw)})</span>
                        <span class="score-badge" style="background-color:${kolor};">
                            ${esc(procent)} (${esc(popr)}${total ? " / " + total : ""} popr.)
                        </span><br>
                        <small>🕒 ${esc(data)}</small><br><br>
                        <button data-akcja="profil" data-id="${esc(u.id)}">Profil</button>
                        <button class="delete" data-akcja="usun" data-id="${esc(u.id)}">Usuń</button>
                    </div>`;
            });

            $("users").innerHTML = html || "Brak wyników.";
        }

        $("search").addEventListener("input", renderUsers);

        $("users").addEventListener("click", e => {
            const btn = e.target.closest("button[data-akcja]");
            if (!btn) return;
            if (btn.dataset.akcja === "profil") showProfile(btn.dataset.id);
            if (btn.dataset.akcja === "usun") deleteUser(btn.dataset.id);
        });

        // ===========================================================
        // Profil kandydata
        // ===========================================================
        async function pobierzZestaw(cfg, id) {
            const klucz = cfg.pytania + "/" + id;
            if (cacheZestawow[klucz]) return cacheZestawow[klucz];
            try {
                const snap = await getDoc(doc(db, cfg.pytania, id));
                const pytania = snap.exists() && Array.isArray(snap.data().pytania) ? snap.data().pytania : [];
                cacheZestawow[klucz] = pytania;
                return pytania;
            } catch (e) {
                console.error("Błąd ładowania struktury pytań:", e);
                return [];
            }
        }

        async function showProfile(id) {
            const u = allData.find(x => x.id === id);
            if (!u) return;
            const cfg = EGZAMINY[aktywny];
            const wybory = Array.isArray(u.wybory) ? u.wybory : [];

            $("profile").innerHTML = "<h3>⏳ Ładowanie profilu...</h3>";

            // Nowe wyniki mają poprawną odpowiedź zapisaną w sobie.
            // Dla starszych wpisów dociągamy zestaw pytań z bazy.
            let zestaw = null;
            if (wybory.some(w => w.poprawna === undefined)) {
                zestaw = await pobierzZestaw(cfg, u.zestaw);
            }

            const zdany = czyZdany(u, cfg);
            const status = zdany === null ? "<b>brak danych</b>"
                : (zdany ? "<b style='color:#4ade80;'>ZDAŁ ✓</b>" : "<b style='color:#f87171;'>NEGATYWNY ✗</b>");
            const procent = u.procent !== undefined ? Number(u.procent) + "%" : "-";

            let html = `<h3>👤 Kandydat: ${esc(u.gracz)}</h3>`;
            html += `<p><b>Arkusz:</b> ${esc(u.zestaw)} | <b>Wynik końcowy:</b> ${status}</p>`;
            html += `<p><b>Statystyki:</b> ${esc(procent)} (Poprawne: ${esc(u.poprawne ?? "-")} / ${wybory.length})</p><hr>`;

            if (!wybory.length) {
                html += "<p>Brak szczegółowych odpowiedzi dla tego kandydata.</p>";
            }

            wybory.forEach((w, j) => {
                let pytanie = w.pytanie;
                const odpowiedz = w.odpowiedz ?? "Brak odpowiedzi";
                let poprawna = w.poprawna;
                let obrazek = w.obrazek;
                let wynik = w.wynik;

                if (zestaw && poprawna === undefined) {
                    const p = zestaw.find(x => x && x.tresc === pytanie) || zestaw[(w.NumerPytania ?? (j + 1)) - 1];
                    if (p) {
                        poprawna = p.odp ? p.odp[p.poprawna] : undefined;
                        obrazek = obrazek || p.obrazek;
                        pytanie = pytanie || p.tresc;
                    }
                }
                if (wynik === undefined && poprawna !== undefined) wynik = (odpowiedz === poprawna);

                const kolor = wynik === true ? "#4ade80" : (wynik === false ? "#f87171" : "#F5F1ED");
                const podpowiedz = (wynik === false && poprawna !== undefined)
                    ? ` <span class="muted">(Poprawna: ${esc(poprawna)})</span>` : "";
                const src = srcObrazka(obrazek);
                const img = src
                    ? `<br><img src="${esc(src)}" alt="Ilustracja do pytania" style="max-width:140px;border-radius:6px;margin:8px 0;box-shadow:0 2px 8px rgba(0,0,0,0.4);">`
                    : "";

                html += `
                    <div class="profile-question">
                        <p>${j + 1}. <b>${esc(pytanie || "Pytanie " + (j + 1))}</b>${img}</p>
                        <p>Odpowiedź: <span style="color:${kolor};font-weight:bold;">${esc(odpowiedz)}</span>${podpowiedz}</p>
                    </div>`;
            });

            $("profile").innerHTML = html;
            $("profileSection").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        // ===========================================================
        // Usuwanie wyniku
        // ===========================================================
        async function deleteUser(id) {
            if (!confirm("Czy na pewno chcesz trwale usunąć wynik tego kandydata?")) return;
            try {
                await deleteDoc(doc(db, EGZAMINY[aktywny].wyniki, id));
                await load();
            } catch (e) {
                console.error("Błąd podczas usuwania wyniku:", e);
                alert("Nie udało się usunąć wyniku.");
            }
        }

        // ===========================================================
        // Przełączanie zakładek
        // ===========================================================
        document.querySelectorAll(".tab").forEach(btn => {
            btn.addEventListener("click", () => {
                if (btn.dataset.egzamin === aktywny) return;
                aktywny = btn.dataset.egzamin;
                document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
                $("search").value = "";
                load();
            });
        });
    </script>
</body>

</html>
