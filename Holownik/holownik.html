<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>SHOWteam — Licencja na Holowanie</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg,
                    #f06e0c 22%,
                    #1F1A17 48%,
                    #000000 75%);
            font-family: "Inter", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 100%;
            max-width: 900px;
            background: rgba(31, 26, 23, 0.96);
            border: 1px solid rgba(230, 120, 23, 0.3);
            border-radius: 16px;
            padding: 30px;
            color: #F5F1ED;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(230, 120, 23, 0.05);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #E67817;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(230, 120, 23, 0.25);
        }

        h2 {
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #F5F1ED;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid rgba(230, 120, 23, 0.3);
            border-radius: 10px;
            background: #2A211B;
            color: #E67817;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:disabled {
            background: #151210;
            color: #665B52;
            border-color: rgba(102, 91, 82, 0.3);
            cursor: not-allowed;
            transform: none !important;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:hover:not(:disabled) {
            background: #E67817;
            color: #1F1A17;
            border-color: #E67817;
            box-shadow: 0 0 15px rgba(230, 120, 23, 0.35);
            transform: translateY(-2px);
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #B5A79D;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #151210;
            border: 2px solid #403127;
            border-radius: 10px;
            padding: 4px 12px;
            transition: all 0.2s ease;
            margin-bottom: 5px;
        }

        .input-wrapper:focus-within {
            border-color: #E67817;
            box-shadow: 0 0 0 3px rgba(230, 120, 23, 0.15);
        }

        .icon {
            margin-right: 10px;
            font-size: 18px;
            user-select: none;
            filter: drop-shadow(0 0 2px rgba(230, 120, 23, 0.4));
        }

        input {
            width: 100%;
            border: none;
            background: transparent;
            color: #F5F1ED;
            font-size: 16px;
            padding: 10px 0;
            font-family: inherit;
        }

        input:focus {
            outline: none;
        }

        input::placeholder {
            color: #776B61;
        }

        .error {
            margin-top: 6px;
            font-size: 13px;
            color: #F87171;
            min-height: 20px;
            font-weight: 500;
        }

        .progress {
            height: 6px;
            background: #100D0B;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-inner {
            height: 100%;
            background: linear-gradient(90deg,
                    #A94F0A,
                    #CC6815,
                    #E67817);
            box-shadow: 0 0 8px rgba(230, 120, 23, 0.45);
            transition: width 0.3s ease;
        }

        .question-img {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: 450px;
            margin: 15px auto 25px auto;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .fade {
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>=== Egzamin – Licencja Holownika ===</h1>
        <div id="app"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, addDoc, collection, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_c5yD2XF-mbCK1NGLYMdIk7UVKGsLxoU",
            authDomain: "motorowodni-49c56.firebaseapp.com",
            projectId: "motorowodni-49c56",
            storageBucket: "motorowodni-49c56.firebasestorage.app",
            messagingSenderId: "634414019790",
            appId: "1:634414019790:web:0e8ffd2c0b613f3b37cc9f",
            measurementId: "G-Z69K7SW8X3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let pytania = [];
        let wybory = [];
        let poprawne = 0;
        let index = 0;
        let daneGracza = "";
        
        // Jedyny stały zestaw pytań w bazie Firebase
        const wybranyZestaw = "HOLOWNIK_ZESTAW_1";

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function menu() {
            appDiv.innerHTML = `<button onclick="start()">Start</button>`;
        }

        document.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                const btn = document.getElementById("startBtn");
                if (btn && !btn.disabled) {
                    startQuiz();
                }
            }
        });

        window.validateNick = function () {
            const input = document.getElementById("nickInput");
            const error = document.getElementById("nickError");
            const btn = document.getElementById("startBtn");

            if (!input) return;
            let value = input.value.trim();

            if (value.length < 3) {
                error.textContent = "Wpisz poprawne Imię i Nazwisko (min. 3 znaki)";
                error.style.color = "#f87171";
                btn.disabled = true;
            } else {
                error.textContent = "OK ✓";
                error.style.color = "#4ade80";
                btn.disabled = false;
            }
        }

        window.start = function () {
            appDiv.innerHTML = `
                <div class="fade-in">
                    <label class="input-label">Podaj Imię i Nazwisko kandydata</label>
                    <div class="input-wrapper">
                        <span class="icon">👤</span>
                        <input id="nickInput" placeholder="Wpisz swoje Imię i Nazwisko..." oninput="validateNick()" autocomplete="off">
                    </div>
                    <div id="nickError" class="error"></div>
                </div>
                <div class="fade-in" style="animation-delay:0.1s; margin-top: 15px;">
                    <button id="startBtn" onclick="startQuiz()" disabled>Rozpocznij Test</button>
                </div>
            `;
        }

        window.startQuiz = async function () {
            const input = document.getElementById("nickInput");
            daneGracza = input ? input.value.trim() : "";

            if (daneGracza.length < 3) return;

            try {
                appDiv.innerHTML = `<h2>Pobieranie arkusza egzaminacyjnego...</h2>`;
                const docRef = doc(db, "baza_pytan_holownik", wybranyZestaw);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    pytania = docSnap.data().pytania;
                } else {
                    alert("Wystąpił problem z pobraniem zestawu z bazy danych!");
                    menu();
                    return;
                }
            } catch (err) {
                console.error(err);
                alert("Błąd połączenia z bazą Firebase!");
                menu();
                return;
            }

            index = 0;
            wybory = [];
            poprawne = 0;

            pytania.forEach(p => {
                p.odpowiedziLosowe = [...p.odp].map((x, i) => ({ tekst: x, idx: i }));
                shuffle(p.odpowiedziLosowe);
            });
            pokazPytanie();
        }

        function pokazPytanie() {
            if (index >= pytania.length) {
                appDiv.innerHTML = `
                    <div class="progress">
                        <div class="progress-inner" style="width:100%"></div>
                    </div>
                    <h2 class="fade" style="text-align:center;">
                        Dziękuję za odpowiedzi! Trwa obliczanie wyniku...
                    </h2>
                `;
                zapiszWybor();
                return;
            }

            let p = pytania[index];
            let progress = (index / pytania.length) * 100;
            let idx = p.odpowiedziLosowe;

            let html = `
                <div class="progress">
                    <div class="progress-inner" style="width:${progress}%"></div>
                </div>
                <h2 class="fade">
                    Pytanie ${index + 1} z ${pytania.length}<br><br>
                    ${p.tresc}
                </h2>
            `;

            if (p.obrazek) {
                html += `<img src="${p.obrazek}" alt="Znak pomocniczy" class="question-img fade">`;
            }

            idx.forEach((i) => {
                html += `
                    <button class="fade" onclick="wybierz(${i.idx})">
                        ${i.tekst}
                    </button>
                `;
            });

            appDiv.innerHTML = html;
        }

        window.wybierz = function (i) {
            let p = pytania[index];
            const czyPoprawna = i === p.poprawna;
            if (czyPoprawna) poprawne++;

            wybory.push({
                NumerPytania: index + 1,
                pytanie: p.tresc,
                obrazek: p.obrazek || "",
                odpowiedz: p.odp[i],
                poprawna: p.odp[p.poprawna],
                wynik: czyPoprawna
            });

            index++;
            pokazPytanie();
        }

        async function zapiszWybor() {
            try {
                await addDoc(collection(db, "holownik"), {
                    gracz: daneGracza,
                    zestaw: wybranyZestaw,
                    wybory: wybory,
                    poprawne: poprawne,
                    procent: Number(((poprawne / pytania.length) * 100).toFixed(2)),
                    data: new Date()
                });

                let podsumowanieSzczegolowe = "";
                wybory.forEach((w) => {
                    podsumowanieSzczegolowe += `
                        <div style="text-align: left; background: #151210; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid ${w.wynik ? 'rgba(74, 222, 128, 0.4)' : 'rgba(248, 113, 113, 0.4)'}; border-left: 5px solid ${w.wynik ? '#4ade80' : '#f87171'}">
                            <p style="margin: 0 0 8px 0; font-weight: bold; font-size: 15px; color: #f1f5f9;">Pytanie ${w.NumerPytania}: ${w.pytanie}</p>
                            ${w.obrazek ? `<img src="${w.obrazek}" style="max-width:250px;display:block;margin:10px auto;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.5);">` : ""}
                            <p style="margin: 4px 0; font-size: 14px; color: ${w.wynik ? '#4ade80' : '#f87171'}">
                                <strong>Twoja odpowiedź:</strong> ${w.odpowiedz} ${w.wynik ? '✓' : '✗'}
                            </p>
                            ${!w.wynik ? `<p style="margin: 4px 0; font-size: 14px; color: #4ade80"><strong>Poprawna odpowiedź:</strong> ${w.poprawna}</p>` : ''}
                        </div>
                    `;
                });

                let procent = Math.round((poprawne / pytania.length) * 100);
                let czyZdal = (poprawne / pytania.length) >= 0.65;

                let statusEgzaminu = czyZdal
                    ? "<span style='color:#4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);'>ZALICZONY ✓</span>"
                    : "<span style='color:#f87171;'>NIEZALICZONY ✗</span>";

                appDiv.innerHTML = `
                    <div style="text-align:center;" class="fade">
                        <h2>Egzamin zakończony!</h2>
                        <p style="font-size: 18px; color: #B5A79D;"><strong>${daneGracza}</strong></p>
                        <p style="font-size: 16px; color: #F5F1ED; margin-top:5px;">Wynik egzaminu: ${statusEgzaminu}</p>
                        <h2 style="color: #E67817; margin-top: 10px; margin-bottom: 25px; text-shadow: 0 0 10px rgba(230, 120, 23, 0.3);">
                            Twój wynik: ${poprawne} / ${pytania.length}<br>
                            Procent: ${procent}%
                        </h2>
                        
                        <div style="max-height: 400px; overflow-y: auto; margin-bottom: 20px; padding-right: 5px;">
                            ${podsumowanieSzczegolowe}
                        </div>

                        <button onclick="start()" style="margin-top: 10px; max-width: 200px;">Rozwiąż ponownie</button>
                    </div>
                `;

                if (window.innerHeight < 800) {
                    document.body.style.height = "auto";
                    document.body.style.padding = "20px 0";
                }
            } catch (e) {
                console.error(e);
                alert("Błąd zapisu wyniku do bazy danych!");
            }
        }

        const appDiv = document.getElementById("app");
        menu();
    </script>
</body>

</html>
